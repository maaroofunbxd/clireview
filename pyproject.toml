[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clireview"
dynamic = ["version"]
description = "What changed in a typer or click CLI, merge by merge, read from git; and a weekly review of it with reviewed-* tags."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
clireview = "clireview.cli:main"

[dependency-groups]
# typer, click: the tests build a small typer CLI and a click one in a git repo and read it back.
dev = ["pytest", "ruff", "typer>=0.15.0", "click>=8"]

[tool.setuptools.dynamic]
version = { attr = "clireview.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["clireview"]
